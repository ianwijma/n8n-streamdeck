/api/devices/{deviceId}/buttons/{position}/press:
  post:
    tags:
      - Buttons
    summary: Simulate button press
    description: Trigger a button press event (for testing purposes)
    security:
      - bearerAuth: []
    parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
        description: Device identifier
        example: streamdeck_001
      - name: position
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
        description: Button position (0-based)
        example: 0
    responses:
      '200':
        description: Button press triggered successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Button press triggered successfully
                data:
                  type: object
                  properties:
                    workflowTriggered:
                      type: boolean
                      example: true
                    webhookResponse:
                      type: object
                      description: Response from N8N webhook
                timestamp:
                  type: string
                  format: date-time
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '404':
        $ref: '#/components/responses/NotFoundError'
      '500':
        $ref: '#/components/responses/InternalServerError'

/api/buttons:
  get:
    tags:
      - Buttons
    summary: List buttons for device
    description: Retrieve all buttons for a specific device
    security:
      - bearerAuth: []
    parameters:
      - name: deviceId
        in: query
        required: true
        schema:
          type: string
        description: Device identifier
        example: streamdeck_001
    responses:
      '200':
        description: Buttons retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Button'
                timestamp:
                  type: string
                  format: date-time
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '500':
        $ref: '#/components/responses/InternalServerError'

/api/devices/{deviceId}/buttons:
  get:
    tags:
      - Buttons
    summary: List device buttons
    description: Retrieve all buttons for a specific device (REST-style endpoint)
    security:
      - bearerAuth: []
    parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
        description: Device identifier
        example: streamdeck_001
    responses:
      '200':
        description: Buttons retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Button'
                timestamp:
                  type: string
                  format: date-time
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '404':
        $ref: '#/components/responses/NotFoundError'
      '500':
        $ref: '#/components/responses/InternalServerError'
  post:
    tags:
      - Buttons
    summary: Create button configuration
    description: Configure a button on a specific device
    security:
      - bearerAuth: []
    parameters:
      - name: deviceId
        in: path
        required: true
        schema:
          type: string
        description: Device identifier
        example: streamdeck_001
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - position
            properties:
              position:
                type: integer
                minimum: 0
                description: Button position on device (0-based)
                example: 0
              title:
                type: string
                maxLength: 50
                description: Button display title
                example: Deploy App
              icon:
                type: string
                description: Button icon (base64 encoded image or URL)
                example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==
              backgroundColor:
                type: string
                pattern: '^#[0-9A-Fa-f]{6}$'
                description: Button background color (hex)
                example: '#FF0000'
              n8nWorkflowId:
                type: string
                description: Associated N8N workflow ID
                example: wf_123456
              n8nWebhookUrl:
                type: string
                format: uri
                description: N8N webhook URL for triggering workflow
                example: https://n8n.example.com/webhook/streamdeck-trigger
              enabled:
                type: boolean
                description: Button enabled status
                example: true
                default: true
    responses:
      '201':
        description: Button configured successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  $ref: '#/components/schemas/Button'
                timestamp:
                  type: string
                  format: date-time
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '404':
        $ref: '#/components/responses/NotFoundError'
      '409':
        description: Button position already configured
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '500':
        $ref: '#/components/responses/InternalServerError'


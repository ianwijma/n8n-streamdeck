/api/auth/setup/check:
  get:
    tags:
      - Authentication
    summary: Check if initial setup is required
    description: Determines if the application needs initial setup (admin user creation)
    responses:
      '200':
        description: Setup status retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    setupRequired:
                      type: boolean
                      example: true
                timestamp:
                  type: string
                  format: date-time

/api/auth/setup:
  post:
    tags:
      - Authentication
    summary: Complete initial application setup
    description: Create the initial admin user account
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthSetup'
    responses:
      '201':
        description: Setup completed successfully
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
      '400':
        $ref: '#/components/responses/ValidationError'
      '409':
        description: Setup already completed
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '429':
        description: Too many setup attempts
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/auth/login:
  post:
    tags:
      - Authentication
    summary: Authenticate user
    description: Login with username and password to receive access token
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthLogin'
    responses:
      '200':
        description: Login successful
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResponse'
        headers:
          Set-Cookie:
            description: Refresh token cookie
            schema:
              type: string
              example: refreshToken=abc123; HttpOnly; Secure; SameSite=Strict
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        description: Invalid credentials
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      '429':
        description: Too many login attempts
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/auth/refresh:
  post:
    tags:
      - Authentication
    summary: Refresh access token
    description: Use refresh token to get a new access token
    security:
      - cookieAuth: []
    responses:
      '200':
        description: Token refreshed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    accessToken:
                      type: string
                      example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                timestamp:
                  type: string
                  format: date-time
      '401':
        $ref: '#/components/responses/UnauthorizedError'

/api/auth/logout:
  post:
    tags:
      - Authentication
    summary: Logout user
    description: Invalidate current session and clear refresh token
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Logout successful
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Logged out successfully
                timestamp:
                  type: string
                  format: date-time
      '401':
        $ref: '#/components/responses/UnauthorizedError'

/api/auth/profile:
  get:
    tags:
      - Authentication
    summary: Get user profile
    description: Retrieve current user profile information
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Profile retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      example: user_123
                    username:
                      type: string
                      example: admin
                    role:
                      type: string
                      example: admin
                    createdAt:
                      type: string
                      format: date-time
                    lastLogin:
                      type: string
                      format: date-time
                timestamp:
                  type: string
                  format: date-time
      '401':
        $ref: '#/components/responses/UnauthorizedError'

/api/auth/change-password:
  post:
    tags:
      - Authentication
    summary: Change user password
    description: Update current user password
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - currentPassword
              - newPassword
            properties:
              currentPassword:
                type: string
                description: Current password
              newPassword:
                type: string
                minLength: 8
                description: New password (minimum 8 characters)
    responses:
      '200':
        description: Password changed successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Password changed successfully
                timestamp:
                  type: string
                  format: date-time
      '400':
        $ref: '#/components/responses/ValidationError'
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '429':
        description: Too many password change attempts
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'

/api/auth/sessions:
  get:
    tags:
      - Authentication
    summary: Get active sessions
    description: List all active sessions for current user
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Sessions retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        example: session_123
                      userAgent:
                        type: string
                        example: Mozilla/5.0...
                      ipAddress:
                        type: string
                        example: 192.168.1.100
                      createdAt:
                        type: string
                        format: date-time
                      lastActivity:
                        type: string
                        format: date-time
                      current:
                        type: boolean
                        example: true
                timestamp:
                  type: string
                  format: date-time
      '401':
        $ref: '#/components/responses/UnauthorizedError'
  delete:
    tags:
      - Authentication
    summary: Revoke all sessions
    description: Revoke all active sessions except current one
    security:
      - bearerAuth: []
    responses:
      '200':
        description: All sessions revoked successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: All sessions revoked successfully
                data:
                  type: object
                  properties:
                    revokedCount:
                      type: integer
                      example: 3
                timestamp:
                  type: string
                  format: date-time
      '401':
        $ref: '#/components/responses/UnauthorizedError'

/api/auth/sessions/{sessionId}:
  delete:
    tags:
      - Authentication
    summary: Revoke specific session
    description: Revoke a specific session by ID
    security:
      - bearerAuth: []
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
        description: Session ID to revoke
    responses:
      '200':
        description: Session revoked successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Session revoked successfully
                timestamp:
                  type: string
                  format: date-time
      '401':
        $ref: '#/components/responses/UnauthorizedError'
      '404':
        $ref: '#/components/responses/NotFoundError'

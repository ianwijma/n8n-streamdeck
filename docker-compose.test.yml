version: '3.8'

services:
  # Backend service for testing
  backend-test:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.test
    environment:
      - NODE_ENV=test
      - PORT=3001
      - CORS_ORIGIN=http://localhost:3000
      - LOG_LEVEL=debug
    ports:
      - '3001:3001'
    volumes:
      - ./apps/backend:/app/backend
      - ./packages:/app/packages
      - /app/backend/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/config/node_modules
    networks:
      - streamdeck-test
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend service for testing
  frontend-test:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile.test
    environment:
      - NODE_ENV=test
      - NEXT_PUBLIC_API_URL=http://backend-test:3001
      - NEXT_PUBLIC_WS_URL=ws://backend-test:3001
    ports:
      - '3000:3000'
    volumes:
      - ./apps/frontend:/app/frontend
      - ./packages:/app/packages
      - /app/frontend/node_modules
      - /app/packages/shared/node_modules
      - /app/packages/config/node_modules
    depends_on:
      backend-test:
        condition: service_healthy
    networks:
      - streamdeck-test

  # N8N service for integration testing
  n8n-test:
    image: n8nio/n8n:latest
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n-test:5678
      - GENERIC_TIMEZONE=UTC
      - N8N_LOG_LEVEL=debug
    ports:
      - '5678:5678'
    volumes:
      - ./apps/n8n-node/dist:/home/node/.n8n/custom
      - n8n_data:/home/node/.n8n
    networks:
      - streamdeck-test
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5678/healthz']
      interval: 10s
      timeout: 5s
      retries: 10

  # Redis for session storage and real-time features
  redis-test:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    networks:
      - streamdeck-test
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # Test runner service
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - NODE_ENV=test
      - BACKEND_URL=http://backend-test:3001
      - FRONTEND_URL=http://frontend-test:3000
      - N8N_URL=http://n8n-test:5678
      - REDIS_URL=redis://redis-test:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      backend-test:
        condition: service_healthy
      frontend-test:
        condition: service_started
      n8n-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - streamdeck-test
    profiles:
      - test

networks:
  streamdeck-test:
    driver: bridge

volumes:
  n8n_data:
